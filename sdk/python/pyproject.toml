[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "baton-sdk"
version = "0.1.0"
description = "Python client and worker for baton, a durable job and workflow engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gagan Gutta" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/GaganGutta/baton"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
baton = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
