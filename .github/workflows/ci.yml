name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # clang-format and clang-tidy are pinned to the LLVM major used for local
  # development so formatting and lint results agree byte for byte.
  LLVM_VERSION: "21"

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-${LLVM_VERSION}
      - name: Check formatting
        run: CLANG_FORMAT=clang-format-${LLVM_VERSION} scripts/format.sh --check

  build-test:
    name: ${{ matrix.compiler.name }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-14, cxx: g++-14 }
          - { name: clang-18, cxx: clang++-18 }
        preset: [release, asan]
    env:
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build redis-tools
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  tsan:
    name: clang-18 / tsan
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      # GitHub runners use a kernel ASLR setting that TSan cannot map around.
      - name: Reduce ASLR entropy for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset tsan
      - name: Build
        run: cmake --build --preset tsan
      - name: Test
        run: ctest --preset tsan

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang-${LLVM_VERSION} clang-tidy-${LLVM_VERSION}
      - name: Configure
        run: >
          cmake --preset tidy
          -DCMAKE_CXX_COMPILER=clang++-${LLVM_VERSION}
          -DBATON_CLANG_TIDY=/usr/bin/clang-tidy-${LLVM_VERSION}
      - name: Build (runs clang-tidy on every baton source)
        run: cmake --build --preset tidy
      - name: Test
        run: ctest --preset tidy

  integration:
    name: integration (redis-cli, redis-py, kill -9)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build redis-tools
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install --quiet pytest redis
      - name: Build
        run: cmake --preset release && cmake --build --preset release --target baton
      - name: Test the real binary with stock Redis clients
        run: BATON_BIN=build/release/src/server/baton "$HOME/venv/bin/python" -m pytest tests/integration -q

  sdk-python:
    name: python sdk (${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Build
        run: cmake --preset release && cmake --build --preset release --target baton
      - name: Install the SDK the way users do
        run: python -m pip install --quiet "./sdk/python[test]"
      - name: Test the SDK against the real binary
        run: BATON_BIN=build/release/src/server/baton python -m pytest sdk/python/tests -q

  fuzz:
    name: fuzz (short run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Configure
        run: cmake --preset fuzz -DCMAKE_CXX_COMPILER=clang++-18
      - name: Build
        run: cmake --build --preset fuzz
      - name: Fuzz every target for 60 seconds
        run: scripts/fuzz.sh 60
      - name: Upload reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reproducers
          path: |
            build/fuzz/corpus/**/crash-*
            build/fuzz/corpus/**/leak-*
            build/fuzz/corpus/**/timeout-*
            build/fuzz/corpus/**/oom-*

  macos:
    name: macOS / debug
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ninja
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t baton:ci .
      - name: Smoke test
        run: docker run --rm baton:ci --version
